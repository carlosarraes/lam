[package]
name = "lam"
version = "0.1.0"
edition = "2021"
description = "Look At Me — queue blockers for Carlos, wait for his answer"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
hostname = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
ratatui = "0.29"
crossterm = "0.28"
# Pinned: 0.3.6+ switched to ratatui-core 0.1 (the 0.30 split) and no longer matches ratatui 0.29.
# default-features off drops syntect, which only highlights fenced code.
tui-markdown = { version = "=0.3.5", default-features = false }

[dev-dependencies]
hostname = "0.4"
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"

[profile.release]
strip = true
lto = true
